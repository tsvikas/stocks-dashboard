[project]
name = "stocks-dashboard"
version = "0.1.0"
description = "Streamlit dashboard for stock log-returns"
requires-python = ">=3.11,<3.14"
dependencies = [
    "altair>=5",
    "numpy>=1.26",
    "pandas>=2.2",
    "streamlit>=1.40",
    "yfinance>=0.2",
    "yfinance-cache>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest]
testpaths = ["tests"]
markers = ["network: requires live access to Yahoo Finance"]
addopts = ["-ra"]

[tool.codespell]
ignore-words-list = "hsi"
